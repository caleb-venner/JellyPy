name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Extracted version: $TAG"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi

      - name: Determine release type
        id: release_type
        run: |
          echo "type=release" >> $GITHUB_OUTPUT
          echo "prerelease=false" >> $GITHUB_OUTPUT

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify version consistency
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"
          PROPS_VERSION=$(grep -oP '<Version>\K[0-9.]+' Directory.Build.props | head -1)
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "Error: Version mismatch between tag ($TAG_VERSION) and Directory.Build.props ($PROPS_VERSION)"
            exit 1
          fi

      - name: Build & Package for 10.9
        id: package_10_9
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_FILE="jellypy_10.9_${VERSION}.zip"
          
          dotnet restore Jellyfin.Plugin.JellyPy.sln -p:JellyfinVersion=10.9.0
          dotnet build Jellyfin.Plugin.JellyPy.sln --configuration Release -p:JellyfinVersion=10.9.0 --no-restore
          dotnet publish Jellyfin.Plugin.JellyPy/Jellyfin.Plugin.JellyPy.csproj --configuration Release -p:JellyfinVersion=10.9.0 --no-build --output ./publish_10_9
          
          cd publish_10_9
          cat <<JSON > meta.json
          {
            "id": "a5bd541f-38dc-467e-9a9a-15fe3f3bcf5c",
            "name": "JellyPy",
            "description": "JellyPy automatically manages your Sonarr and Radarr monitoring based on what you watch in Jellyfin.",
            "category": "General",
            "guid": "a5bd541f-38dc-467e-9a9a-15fe3f3bcf5c",
            "version": "$VERSION",
            "targetAbi": "10.9.0.0"
          }
JSON
          zip -r "../${ZIP_FILE}" .
          cd ..
          
          CHECKSUM=$(md5sum "$ZIP_FILE" | cut -d' ' -f1)
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Build & Package for 10.10
        id: package_10_10
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_FILE="jellypy_10.10_${VERSION}.zip"
          
          dotnet restore Jellyfin.Plugin.JellyPy.sln -p:JellyfinVersion=10.10.6
          dotnet build Jellyfin.Plugin.JellyPy.sln --configuration Release -p:JellyfinVersion=10.10.6 --no-restore
          dotnet publish Jellyfin.Plugin.JellyPy/Jellyfin.Plugin.JellyPy.csproj --configuration Release -p:JellyfinVersion=10.10.6 --no-build --output ./publish_10_10
          
          cd publish_10_10
          cat <<JSON > meta.json
          {
            "id": "a5bd541f-38dc-467e-9a9a-15fe3f3bcf5c",
            "name": "JellyPy",
            "description": "JellyPy automatically manages your Sonarr and Radarr monitoring based on what you watch in Jellyfin.",
            "category": "General",
            "guid": "a5bd541f-38dc-467e-9a9a-15fe3f3bcf5c",
            "version": "$VERSION",
            "targetAbi": "10.10.0.0"
          }
JSON
          zip -r "../${ZIP_FILE}" .
          cd ..
          
          CHECKSUM=$(md5sum "$ZIP_FILE" | cut -d' ' -f1)
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANGELOG=$(git tag -l --format='%(contents)' "$TAG" || echo "See CHANGELOG.md for details")
          if [ -z "$CHANGELOG" ]; then CHANGELOG="See CHANGELOG.md for details"; fi
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package_10_9.outputs.zip_file }}
            ${{ steps.package_10_10.outputs.zip_file }}
          name: Release ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            ## JellyPy ${{ steps.version.outputs.version }}
            
            **Release Type:** ${{ steps.release_type.outputs.type == 'stable' && 'Stable' || 'Beta' }}
            
            ### Downloads
            - [Jellyfin 10.9 (jellypy_10.9_${{ steps.version.outputs.version }}.zip)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.package_10_9.outputs.zip_file }}) (MD5: `${{ steps.package_10_9.outputs.checksum }}`)
            - [Jellyfin 10.10 (jellypy_10.10_${{ steps.version.outputs.version }}.zip)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.package_10_10.outputs.zip_file }}) (MD5: `${{ steps.package_10_10.outputs.checksum }}`)
            
            ### Installation
            Add the repository URL to your Jellyfin plugin repositories:
            - **Stable Channel:** `https://caleb-venner.github.io/jellypy/manifest.json`
            - **Beta Channel:** `https://caleb-venner.github.io/jellypy/manifest-beta.json`
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          prerelease: false
          draft: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="${{ steps.changelog.outputs.changelog }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          CHANGELOG_JSON=$(echo "$CHANGELOG" | jq -Rs .)
          
          SOURCEURL_10_9="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.package_10_9.outputs.zip_file }}"
          CHECKSUM_10_9="${{ steps.package_10_9.outputs.checksum }}"
          
          SOURCEURL_10_10="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.package_10_10.outputs.zip_file }}"
          CHECKSUM_10_10="${{ steps.package_10_10.outputs.checksum }}"
          
          NEW_ENTRY_10_9=$(cat <<JSON
          {
            "version": "$VERSION",
            "changelog": $CHANGELOG_JSON,
            "targetAbi": "10.9.0.0",
            "sourceUrl": "$SOURCEURL_10_9",
            "checksum": "$CHECKSUM_10_9",
            "timestamp": "$TIMESTAMP"
          }
          JSON
          )
          
          NEW_ENTRY_10_10=$(cat <<JSON
          {
            "version": "$VERSION",
            "changelog": $CHANGELOG_JSON,
            "targetAbi": "10.10.0.0",
            "sourceUrl": "$SOURCEURL_10_10",
            "checksum": "$CHECKSUM_10_10",
            "timestamp": "$TIMESTAMP"
          }
          JSON
          )
          
          jq --argjson entry9 "$NEW_ENTRY_10_9" --argjson entry10 "$NEW_ENTRY_10_10" \
            '.[0].versions = [$entry10, $entry9] + .[0].versions' \
            manifest.json > manifest.json.tmp
          
          mv manifest.json.tmp manifest.json

      - name: Commit and push manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
            exit 0
          fi
          git commit -m "Update manifest for v$VERSION"
          git push origin main
